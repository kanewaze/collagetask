<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>College Tasks • Reminders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Toast Notification Stack -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <div class="app-container">

    <!-- 1. LOGIN SCREEN -->
    <section id="loginView" class="view-login">
      <div class="login-brand-icon">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
      <h1 class="login-title">College Tasks</h1>
      <p class="login-subtitle">An iPhone Reminders-style tracker for your courses, assignments, and study group.</p>

      <div class="login-card">
        <div class="ios-input-group">
          <label class="ios-input-label" for="loginUsernameInput">Student Name</label>
          <input 
            type="text" 
            id="loginUsernameInput" 
            class="ios-input" 
            placeholder="e.g. Ahmed, Sarah, Alex..." 
            autocomplete="name"
            maxlength="30"
          />
        </div>
        <button id="loginSubmitBtn" class="ios-btn">
          <span>Let's Go</span>
          <span>&rarr;</span>
        </button>

        <!-- Quick Select Previous Users -->
        <div id="quickUsersSection" class="quick-users-section hidden">
          <div class="quick-users-label">Or sign in as</div>
          <div id="quickUsersChips" class="quick-users-chips"></div>
        </div>
      </div>
    </section>

    <!-- 2. MAIN APPLICATION -->
    <main id="mainView" class="hidden">
      <!-- Top Sticky Header -->
      <header class="top-header">
        <div class="header-user-row">
          <div class="header-profile">
            <div id="headerAvatar" class="avatar">U</div>
            <div class="header-info">
              <h2 id="headerUsername">Student</h2>
              <p>College Reminders</p>
            </div>
          </div>
          <div class="header-actions">
            <button id="headerLogoutBtn" class="icon-btn" title="Sign out" aria-label="Sign out">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Stats Pills -->
        <div class="stats-bar">
          <div class="stats-pill">
            <div class="stats-pill-icon done">✓</div>
            <div class="stats-pill-content">
              <span id="statDoneCount" class="stats-pill-value">0</span>
              <span class="stats-pill-label">Completed</span>
            </div>
          </div>
          <div class="stats-pill">
            <div class="stats-pill-icon pending">⏳</div>
            <div class="stats-pill-content">
              <span id="statPendingCount" class="stats-pill-value">0</span>
              <span class="stats-pill-label">Pending</span>
            </div>
          </div>
        </div>
      </header>

      <!-- View Containers -->
      <div class="main-content">
        <!-- Tab 1: My Tasks -->
        <section id="viewMyTasks" class="view-section active">
          <div id="myTasksContainer"></div>
        </section>

        <!-- Tab 2: Friends -->
        <section id="viewFriends" class="view-section">
          <div class="section-title-wrap">
            <span class="section-title">Classmates & Friends</span>
          </div>
          <div id="friendsContainer"></div>
        </section>

        <!-- Tab 3: Activity -->
        <section id="viewActivity" class="view-section">
          <div class="section-title-wrap">
            <span class="section-title">Recent Activity</span>
          </div>
          <div id="activityContainer"></div>
        </section>
      </div>

      <!-- Floating Action Button for Adding Task -->
      <button id="fabAddTask" class="fab-btn" title="Add Task" aria-label="Add Task">+</button>

      <!-- Bottom Tab Bar -->
      <nav class="bottom-tab-bar" aria-label="Bottom Navigation">
        <button id="tabBtnMyTasks" class="tab-item active" aria-label="My Tasks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            <path d="M9 14l2 2 4-4"></path>
          </svg>
          <span>My Tasks</span>
        </button>

        <button id="tabBtnFriends" class="tab-item" aria-label="Friends">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Friends</span>
        </button>

        <button id="tabBtnActivity" class="tab-item" aria-label="Activity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Activity</span>
        </button>
      </nav>
    </main>

    <!-- 3. ADD / EDIT TASK MODAL (iOS SHEET) -->
    <div id="taskModalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
      <div class="modal-sheet">
        <div class="modal-drag-handle"></div>
        <div class="modal-header">
          <button id="modalCloseBtn" type="button" class="modal-cancel-btn">Cancel</button>
          <h3 id="taskModalTitle">New Task</h3>
          <span style="width: 50px;"></span>
        </div>

        <form id="taskForm">
          <!-- Task Title -->
          <div class="ios-input-group">
            <label class="ios-input-label" for="taskInputTitle">Assignment Title *</label>
            <input 
              type="text" 
              id="taskInputTitle" 
              class="ios-input" 
              placeholder="e.g. Database Project Milestone 1" 
              required 
              maxlength="100"
            />
          </div>

          <!-- Subject / Course -->
          <div class="ios-input-group">
            <label class="ios-input-label" for="taskInputSubject">Subject / Course</label>
            <input 
              type="text" 
              id="taskInputSubject" 
              class="ios-input" 
              placeholder="e.g. CS401, Math, Documentation Systems" 
              maxlength="40"
            />
          </div>

          <!-- Due Date -->
          <div class="ios-input-group">
            <label class="ios-input-label" for="taskInputDueDate">Due Date</label>
            <input 
              type="date" 
              id="taskInputDueDate" 
              class="ios-input"
            />
          </div>

          <!-- Priority Segmented Control -->
          <div class="ios-input-group">
            <label class="ios-input-label">Priority</label>
            <div class="segmented-control" role="group" aria-label="Priority selector">
              <button type="button" class="segmented-option low" data-priority="low">Low</button>
              <button type="button" class="segmented-option medium active" data-priority="medium">Medium</button>
              <button type="button" class="segmented-option high" data-priority="high">High</button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="taskSubmitBtn" class="ios-btn" style="margin-top: 10px;">
            Save Task
          </button>
        </form>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
